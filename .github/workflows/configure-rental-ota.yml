name: Configure Rental OTA Updates

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/configure-rental-ota.yml']

permissions:
  contents: write

concurrency:
  group: rental-configure-ota
  cancel-in-progress: false

jobs:
  configure:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies and expo-updates
        working-directory: my-rentals-mobile
        env:
          CI: 1
          EXPO_NO_TELEMETRY: 1
          NPM_CONFIG_LEGACY_PEER_DEPS: true
        run: |
          npm install --legacy-peer-deps --no-audit --no-fund
          npx expo install expo-updates
      - name: Configure OTA
        shell: bash
        run: |
          python3 <<'PY'
          import json
          from pathlib import Path
          p=Path('my-rentals-mobile/app.json'); app=json.loads(p.read_text()); expo=app['expo']; pid=expo['extra']['eas']['projectId']
          expo['runtimeVersion']={'policy':'appVersion'}
          expo['updates']={'url':f'https://u.expo.dev/{pid}','checkAutomatically':'ON_ERROR_RECOVERY','fallbackToCacheTimeout':0}
          p.write_text(json.dumps(app,ensure_ascii=False,indent=2)+'\n')
          p=Path('my-rentals-mobile/eas.json'); eas=json.loads(p.read_text())
          eas.setdefault('build',{}).setdefault('preview',{})['channel']='preview'
          eas.setdefault('build',{}).setdefault('production',{})['channel']='production'
          p.write_text(json.dumps(eas,ensure_ascii=False,indent=2)+'\n')
          PY
          cat > my-rentals-mobile/src/lib/appUpdates.ts <<'EOF'
          import * as Updates from 'expo-updates';
          import { useEffect, useRef } from 'react';
          import { AppState, Platform } from 'react-native';

          const FOREGROUND_CHECK_INTERVAL_MS = 5 * 60 * 1000;
          let updateCheckInProgress = false;

          async function checkDownloadAndApplyUpdate() {
            if (__DEV__ || Platform.OS === 'web' || !Updates.isEnabled || updateCheckInProgress) return;
            updateCheckInProgress = true;
            try {
              const check = await Updates.checkForUpdateAsync();
              if (!check.isAvailable) return;
              const fetched = await Updates.fetchUpdateAsync();
              if (fetched.isNew) await Updates.reloadAsync();
            } catch (error) {
              console.warn('[app-updates] Automatic update check failed:', error);
            } finally {
              updateCheckInProgress = false;
            }
          }

          export function useAutomaticAppUpdates() {
            const lastCheckAt = useRef(0);
            useEffect(() => {
              const checkNow = () => {
                const now = Date.now();
                if (now - lastCheckAt.current < FOREGROUND_CHECK_INTERVAL_MS) return;
                lastCheckAt.current = now;
                void checkDownloadAndApplyUpdate();
              };
              checkNow();
              const subscription = AppState.addEventListener('change', state => {
                if (state === 'active') checkNow();
              });
              return () => subscription.remove();
            }, []);
          }
          EOF
          python3 <<'PY'
          from pathlib import Path
          p=Path('my-rentals-mobile/src/app/_layout.tsx'); text=p.read_text()
          imp='import { useAutomaticAppUpdates } from "../lib/appUpdates";\n'; anchor='import { AuthProvider, useAuth } from "../context/AuthContext";\n'
          if imp not in text: text=text.replace(anchor,anchor+imp,1)
          hook='  useAutomaticAppUpdates();\n'; anchor2='  const alertPatched = useRef(false);\n'
          if hook not in text: text=text.replace(anchor2,anchor2+hook,1)
          p.write_text(text)
          PY
      - name: Validate OTA configuration
        working-directory: my-rentals-mobile
        env:
          EXPO_NO_TELEMETRY: 1
        run: |
          npx expo config --type public >/tmp/rental-expo-config.txt
          node <<'NODE'
          const fs=require('fs'),ts=require('typescript');
          for(const file of ['src/lib/appUpdates.ts','src/app/_layout.tsx']){
            const r=ts.transpileModule(fs.readFileSync(file,'utf8'),{reportDiagnostics:true,compilerOptions:{jsx:ts.JsxEmit.ReactJSX,module:ts.ModuleKind.ESNext,target:ts.ScriptTarget.ES2022},fileName:file});
            const e=(r.diagnostics||[]).filter(d=>d.category===ts.DiagnosticCategory.Error); if(e.length) process.exit(1); console.log(`Syntax OK: ${file}`);
          }
          NODE
          grep -q 'expo-updates' package.json
          grep -q 'useAutomaticAppUpdates' src/app/_layout.tsx
      - name: Commit OTA configuration
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add my-rentals-mobile/package.json my-rentals-mobile/package-lock.json my-rentals-mobile/app.json my-rentals-mobile/eas.json my-rentals-mobile/src/lib/appUpdates.ts my-rentals-mobile/src/app/_layout.tsx
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Enable automatic Rental app OTA updates"
          git push origin HEAD:main
