name: Deploy Rental

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    name: Deploy API and clear Laravel cache
    runs-on: ubuntu-latest

    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.RENTAL_SSH_HOST || secrets.SSH_HOST || 'rental.pm.sa' }}
          username: ${{ secrets.RENTAL_SSH_USER || secrets.SSH_USER || secrets.DEPLOY_USER || 'root' }}
          key: ${{ secrets.RENTAL_SSH_KEY || secrets.SSH_PRIVATE_KEY || secrets.DEPLOY_KEY || secrets.SSH_KEY }}
          password: ${{ secrets.RENTAL_SSH_PASSWORD || secrets.SSH_PASSWORD || secrets.DEPLOY_PASSWORD }}
          port: ${{ secrets.RENTAL_SSH_PORT || secrets.SSH_PORT || '22' }}
          script: |
            set -e

            PROJECT_PATH="${{ secrets.RENTAL_PROJECT_PATH }}"
            if [ -z "$PROJECT_PATH" ]; then
              if [ -d /home/pmsa/apps/rental ]; then
                PROJECT_PATH=/home/pmsa/apps/rental
              elif [ -d /mnt/home-storage/home/pmsa/apps/rental ]; then
                PROJECT_PATH=/mnt/home-storage/home/pmsa/apps/rental
              elif [ -d /home/pmsa/apps/my-rentals-api ]; then
                PROJECT_PATH=/home/pmsa/apps
              elif [ -d /mnt/home-storage/home/pmsa/apps/my-rentals-api ]; then
                PROJECT_PATH=/mnt/home-storage/home/pmsa/apps
              else
                PROJECT_PATH=/home/pmsa/apps/rental
              fi
            fi

            echo "Using project path: $PROJECT_PATH"
            cd "$PROJECT_PATH"
            git config --global --add safe.directory "$PROJECT_PATH" || true
            git pull --ff-only origin main

            cd "$PROJECT_PATH/my-rentals-api"
            php artisan migrate --force
            php artisan optimize:clear
            php artisan route:clear
            php artisan config:clear
            php artisan cache:clear
            php artisan route:list | grep -E "webhook-events|scheduled-messages|dashboard" || true

            echo "Deployment finished successfully."
