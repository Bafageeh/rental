name: Deploy Rental to PSM

on:
  push:
    branches: [main]
    paths:
      - 'my-rentals-api/**'
      - 'my-rentals-mobile/**'
      - 'ops/psm/**'
      - '.github/workflows/deploy.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rental-psm-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PSM_HOST: ${{ secrets.PSM_RENTAL_SSH_HOST }}
      PSM_PORT: ${{ secrets.PSM_RENTAL_SSH_PORT }}
      PSM_USER: ${{ secrets.PSM_RENTAL_SSH_USER }}
      PSM_KEY: ${{ secrets.PSM_RENTAL_SSH_KEY }}
      PSM_KNOWN_HOSTS: ${{ secrets.PSM_RENTAL_SSH_KNOWN_HOSTS }}
    steps:
      - name: Deploy using the independent PSM account
        shell: bash
        run: |
          set -euo pipefail
          test -n "$PSM_HOST" && test -n "$PSM_PORT" && test -n "$PSM_USER" && test -n "$PSM_KEY"
          install -m 700 -d "$HOME/.ssh"
          printf '%s\n' "$PSM_KEY" > "$HOME/.ssh/psm_rental"
          chmod 600 "$HOME/.ssh/psm_rental"
          trap 'rm -f "$HOME/.ssh/psm_rental"' EXIT
          test -n "$PSM_KNOWN_HOSTS"
          printf '%s\n' "$PSM_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          ssh -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes \
            -i "$HOME/.ssh/psm_rental" -p "$PSM_PORT" "$PSM_USER@$PSM_HOST" \
            "deploy $GITHUB_SHA"
