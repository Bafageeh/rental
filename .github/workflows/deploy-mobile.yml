name: Deploy Rental Mobile

on:
  push:
    branches:
      - main
    paths:
      - 'my-rentals-mobile/**'
      - '.github/workflows/deploy-mobile.yml'
  workflow_dispatch:

concurrency:
  group: rental-deploy-mobile-main
  cancel-in-progress: true

jobs:
  deploy:
    name: Deploy Expo mobile from monorepo
    runs-on: ubuntu-latest

    steps:
      - name: Validate deployment secrets
        run: |
          test -n "${{ secrets.DEPLOY_HOST }}" || exit 1
          test -n "${{ secrets.DEPLOY_USER }}" || exit 1
          test -n "${{ secrets.DEPLOY_PORT }}" || exit 1
          test -n "${{ secrets.DEPLOY_SSH_KEY }}" || exit 1

      - name: Deploy over SSH
        shell: bash
        timeout-minutes: 15
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -p "${{ secrets.DEPLOY_PORT }}" "${{ secrets.DEPLOY_HOST }}" >> ~/.ssh/known_hosts

          ssh -i ~/.ssh/deploy_key -p "${{ secrets.DEPLOY_PORT }}" -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes "${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}" 'bash -s' <<'REMOTE'
          set -e

          SOURCE="/home/pmsa/apps/rental-source"
          MOBILE_PATH="/home/pmsa/apps/rental/my-rentals-mobile"
          REPO="git@github.com:Bafageeh/rental.git"

          mkdir -p /home/pmsa/apps

          if [ ! -d "$SOURCE/.git" ]; then
            rm -rf "$SOURCE"
            git clone "$REPO" "$SOURCE"
          else
            cd "$SOURCE"
            git remote set-url origin "$REPO"
            git fetch origin main
            git reset --hard origin/main
          fi

          mkdir -p "$MOBILE_PATH"
          rsync -a --delete \
            --exclude='.git' \
            --exclude='node_modules' \
            --exclude='.expo' \
            "$SOURCE/my-rentals-mobile/" "$MOBILE_PATH/"

          cd "$MOBILE_PATH"

          mkdir -p /home/pmsa/apps/.cache /home/pmsa/apps/.tmp
          rm -rf .expo .expo-shared node_modules/.cache .metro-cache
          rm -rf /home/pmsa/apps/.cache/expo /home/pmsa/apps/.cache/metro /home/pmsa/apps/.cache/react-native

          npm install --no-audit --no-fund

          chmod +x scripts/start-expo-8081.sh || true
          bash scripts/start-expo-8081.sh || true

          sleep 8
          tail -n 120 /home/pmsa/apps/my-rentals-expo.log || true
          REMOTE
