name: Deploy Rental Mobile

on:
  push:
    branches:
      - main
    paths:
      - 'my-rentals-mobile/**'
      - '.github/workflows/deploy-mobile.yml'
  workflow_dispatch:

concurrency:
  group: rental-deploy-mobile-main
  cancel-in-progress: true

jobs:
  deploy:
    name: Deploy Expo 57 mobile from monorepo
    runs-on: ubuntu-latest
    env:
      RENTAL_DEPLOY_HOST: ${{ secrets.DEPLOY_HOST || secrets.RENTAL_DEPLOY_HOST || secrets.SERVER_HOST || secrets.SSH_HOST }}
      RENTAL_DEPLOY_USER: ${{ secrets.DEPLOY_USER || secrets.RENTAL_DEPLOY_USER || secrets.SERVER_USER || secrets.SSH_USER }}
      RENTAL_DEPLOY_PORT: ${{ secrets.DEPLOY_PORT || secrets.RENTAL_DEPLOY_PORT || secrets.SERVER_PORT || secrets.SSH_PORT }}
      RENTAL_DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY || secrets.RENTAL_DEPLOY_SSH_KEY || secrets.SSH_PRIVATE_KEY || secrets.SERVER_SSH_KEY }}

    steps:
      - name: Validate deployment secrets
        shell: bash
        run: |
          set -euo pipefail
          missing=0
          if [ -z "${RENTAL_DEPLOY_HOST:-}" ]; then echo "Missing deploy host"; missing=1; fi
          if [ -z "${RENTAL_DEPLOY_USER:-}" ]; then echo "Missing deploy user"; missing=1; fi
          if [ -z "${RENTAL_DEPLOY_PORT:-}" ]; then echo "Missing deploy port"; missing=1; fi
          if [ -z "${RENTAL_DEPLOY_SSH_KEY:-}" ]; then echo "Missing SSH key"; missing=1; fi
          exit "$missing"

      - name: Deploy Expo SDK 57 over SSH
        shell: bash
        timeout-minutes: 20
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          printf '%s\n' "$RENTAL_DEPLOY_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -p "$RENTAL_DEPLOY_PORT" "$RENTAL_DEPLOY_HOST" >> ~/.ssh/known_hosts

          ssh -i ~/.ssh/deploy_key -p "$RENTAL_DEPLOY_PORT" -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes "$RENTAL_DEPLOY_USER@$RENTAL_DEPLOY_HOST" 'bash -s' <<'REMOTE'
          set -euo pipefail

          BASE="/mnt/home-storage/home/pmsa/apps"
          SOURCE="$BASE/rental-source"
          MOBILE_PATH="$BASE/rental/my-rentals-mobile"
          REPO="git@github.com:Bafageeh/rental.git"

          mkdir -p "$BASE" "$BASE/.cache" "$BASE/.tmp"

          if [ ! -d "$SOURCE/.git" ]; then
            rm -rf "$SOURCE"
            git clone "$REPO" "$SOURCE"
          else
            cd "$SOURCE"
            git remote set-url origin "$REPO"
            git fetch origin main
            git reset --hard origin/main
          fi

          mkdir -p "$MOBILE_PATH"
          rsync -a --delete \
            --exclude='.git' \
            --exclude='node_modules' \
            --exclude='.expo' \
            "$SOURCE/my-rentals-mobile/" "$MOBILE_PATH/"

          cd "$MOBILE_PATH"

          if [ -x /opt/cpanel/ea-nodejs22/bin/node ]; then
            export PATH="/opt/cpanel/ea-nodejs22/bin:$PATH"
          fi

          echo "NODE=$(node -v)"
          echo "NPM=$(npm -v)"
          node -e 'const [M,m]=process.versions.node.split(".").map(Number); if (M < 22 || (M === 22 && m < 13)) { console.error("Expo SDK 57 requires Node >= 22.13"); process.exit(1) }'

          rm -rf .expo .expo-shared node_modules/.cache .metro-cache
          rm -rf "$BASE/.cache/expo" "$BASE/.cache/metro" "$BASE/.cache/react-native" || true

          npm install --no-audit --no-fund
          npx expo install --fix
          npm uninstall --no-audit --no-fund \
            @react-navigation/bottom-tabs \
            @react-navigation/elements \
            @react-navigation/native || true
          npx expo-doctor || true

          echo "--- Unsupported React Navigation imports ---"
          if grep -R --line-number \
            --exclude-dir=node_modules \
            --include='*.ts' --include='*.tsx' --include='*.js' --include='*.jsx' \
            '@react-navigation/' src; then
            echo "ERROR: Direct @react-navigation imports remain in src. Expo Router SDK 57 must own navigation."
            exit 1
          fi
          echo "No direct @react-navigation imports found."

          # Keep the existing rental runtime compatibility patches, but run Expo Go on SDK 57 / port 8090.
          sed -i 's/PORT="8083"/PORT="8090"/' scripts/start-expo-8081.sh || true
          sed -i 's/HOSTNAME="my.pm.sa"/HOSTNAME="rental.pm.sa"/' scripts/start-expo-8081.sh || true
          sed -i 's/--dev-client --host/--go --host/' scripts/start-expo-8081.sh || true
          sed -i '/rm -rf \.expo \.expo-shared \.metro-cache node_modules\/\.cache || true/a mkdir -p .expo/types' scripts/start-expo-8081.sh || true
          chmod +x scripts/start-expo-8081.sh
          bash scripts/start-expo-8081.sh

          sleep 8
          echo "--- Expo SDK ---"
          npx expo --version || true
          echo "--- Port 8090 ---"
          if command -v ss >/dev/null 2>&1; then ss -lntp | grep ':8090' || true; fi

          echo "--- Android bundle validation ---"
          BUNDLE_URL='http://127.0.0.1:8090/node_modules/expo-router/entry.bundle?platform=android&dev=true&hot=false&lazy=true&transform.engine=hermes&transform.bytecode=1&transform.routerRoot=src%2Fapp&unstable_transformProfile=hermes-stable'
          if ! curl --fail --silent --show-error --max-time 180 "$BUNDLE_URL" -o /tmp/rental-entry.bundle; then
            echo "ERROR: Android bundle request failed."
            tail -n 240 /home/pmsa/apps/my-rentals-expo.log || true
            exit 1
          fi
          if [ ! -s /tmp/rental-entry.bundle ]; then
            echo "ERROR: Android bundle response is empty."
            tail -n 240 /home/pmsa/apps/my-rentals-expo.log || true
            exit 1
          fi
          echo "Android bundle OK ($(wc -c < /tmp/rental-entry.bundle) bytes)."

          echo "--- Expo log ---"
          tail -n 160 /home/pmsa/apps/my-rentals-expo.log || true
          REMOTE
