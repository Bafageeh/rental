name: Deploy Rental Mobile

on:
  push:
    branches:
      - main
    paths:
      - 'my-rentals-mobile/**'
      - '.github/workflows/deploy-mobile.yml'
  workflow_dispatch:

concurrency:
  group: rental-deploy-mobile-main
  cancel-in-progress: true

jobs:
  deploy:
    name: Deploy Expo SDK 55 development client
    runs-on: ubuntu-latest
    env:
      RENTAL_DEPLOY_HOST: ${{ secrets.DEPLOY_HOST || secrets.RENTAL_DEPLOY_HOST || secrets.SERVER_HOST || secrets.SSH_HOST }}
      RENTAL_DEPLOY_USER: ${{ secrets.DEPLOY_USER || secrets.RENTAL_DEPLOY_USER || secrets.SERVER_USER || secrets.SSH_USER }}
      RENTAL_DEPLOY_PORT: ${{ secrets.DEPLOY_PORT || secrets.RENTAL_DEPLOY_PORT || secrets.SERVER_PORT || secrets.SSH_PORT }}
      RENTAL_DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY || secrets.RENTAL_DEPLOY_SSH_KEY || secrets.SSH_PRIVATE_KEY || secrets.SERVER_SSH_KEY }}

    steps:
      - name: Validate deployment secrets
        shell: bash
        run: |
          set -euo pipefail
          missing=0
          if [ -z "${RENTAL_DEPLOY_HOST:-}" ]; then echo "Missing deploy host"; missing=1; fi
          if [ -z "${RENTAL_DEPLOY_USER:-}" ]; then echo "Missing deploy user"; missing=1; fi
          if [ -z "${RENTAL_DEPLOY_PORT:-}" ]; then echo "Missing deploy port"; missing=1; fi
          if [ -z "${RENTAL_DEPLOY_SSH_KEY:-}" ]; then echo "Missing SSH key"; missing=1; fi
          exit "$missing"

      - name: Deploy Expo SDK 55 over SSH
        shell: bash
        timeout-minutes: 20
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          printf '%s\n' "$RENTAL_DEPLOY_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -p "$RENTAL_DEPLOY_PORT" "$RENTAL_DEPLOY_HOST" >> ~/.ssh/known_hosts

          ssh -i ~/.ssh/deploy_key -p "$RENTAL_DEPLOY_PORT" -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes "$RENTAL_DEPLOY_USER@$RENTAL_DEPLOY_HOST" 'bash -s' <<'REMOTE'
          set -euo pipefail

          BASE="/mnt/home-storage/home/pmsa/apps"
          SOURCE="$BASE/rental-source"
          MOBILE_PATH="$BASE/rental/my-rentals-mobile"
          REPO="git@github.com:Bafageeh/rental.git"

          mkdir -p "$BASE" "$BASE/.cache" "$BASE/.tmp"

          if [ ! -d "$SOURCE/.git" ]; then
            rm -rf "$SOURCE"
            git clone "$REPO" "$SOURCE"
          else
            cd "$SOURCE"
            git remote set-url origin "$REPO"
            git fetch origin main
            git reset --hard origin/main
          fi

          mkdir -p "$MOBILE_PATH"
          rsync -a --delete \
            --exclude='.git' \
            --exclude='node_modules' \
            --exclude='.expo' \
            "$SOURCE/my-rentals-mobile/" "$MOBILE_PATH/"

          cd "$MOBILE_PATH"

          if [ -x /opt/cpanel/ea-nodejs22/bin/node ]; then
            export PATH="/opt/cpanel/ea-nodejs22/bin:$PATH"
          fi

          echo "NODE=$(node -v)"
          echo "NPM=$(npm -v)"

          # Stop the SDK 57 / Expo Go Metro instance before replacing dependencies.
          if command -v lsof >/dev/null 2>&1; then
            OLD_PIDS="$(lsof -tiTCP:8090 -sTCP:LISTEN 2>/dev/null || true)"
            [ -n "$OLD_PIDS" ] && echo "$OLD_PIDS" | xargs -r kill -9 2>/dev/null || true
          fi
          pkill -f 'expo start.*--port 8090|node.*8090' 2>/dev/null || true
          sleep 2

          # A clean dependency tree is required when moving backward from RN 0.86 / SDK 57.
          rm -rf node_modules package-lock.json .expo .expo-shared .metro-cache
          rm -rf "$BASE/.cache/expo" "$BASE/.cache/metro" "$BASE/.cache/react-native" "$BASE/.cache"/metro-* "$BASE/.cache"/haste-map-* || true
          npm cache verify || true
          npm install --no-audit --no-fund

          echo "--- Runtime versions ---"
          node -p "'expo=' + require('expo/package.json').version"
          node -p "'expo-router=' + require('expo-router/package.json').version"
          node -p "'expo-dev-client=' + require('expo-dev-client/package.json').version"
          node -p "'react-native=' + require('react-native/package.json').version"
          node -p "'react-native-reanimated=' + require('react-native-reanimated/package.json').version"
          node -p "'react-native-screens=' + require('react-native-screens/package.json').version"
          node -p "'react-native-worklets=' + require('react-native-worklets/package.json').version"

          echo "--- Expo doctor ---"
          npx expo-doctor || true

          chmod +x scripts/start-expo-8081.sh
          bash scripts/start-expo-8081.sh

          sleep 8
          echo "--- Port 8090 ---"
          if command -v ss >/dev/null 2>&1; then ss -lntp | grep ':8090'; fi

          echo "--- Metro status ---"
          curl --fail --silent --show-error --max-time 30 http://127.0.0.1:8090/status
          echo

          echo "--- Android bundle validation ---"
          BUNDLE_URL='http://127.0.0.1:8090/node_modules/expo-router/entry.bundle?platform=android&dev=true&hot=false&lazy=true&transform.engine=hermes&transform.bytecode=1&transform.routerRoot=src%2Fapp&unstable_transformProfile=hermes-stable'
          if ! curl --fail --silent --show-error --max-time 180 "$BUNDLE_URL" -o /tmp/rental-entry-sdk55.bundle; then
            echo "ERROR: SDK 55 Android bundle request failed."
            tail -n 240 /home/pmsa/apps/my-rentals-expo.log || true
            exit 1
          fi
          test -s /tmp/rental-entry-sdk55.bundle
          echo "SDK 55 Android bundle OK ($(wc -c < /tmp/rental-entry-sdk55.bundle) bytes)."

          echo "--- Expo log ---"
          tail -n 180 /home/pmsa/apps/my-rentals-expo.log || true
          REMOTE
