name: Deploy Rental Mobile

on:
  push:
    branches:
      - main
    paths:
      - 'my-rentals-mobile/**'
      - '.github/workflows/deploy-mobile.yml'
  workflow_dispatch:

concurrency:
  group: rental-deploy-mobile-main
  cancel-in-progress: true

jobs:
  deploy:
    name: Deploy Expo mobile from monorepo
    runs-on: ubuntu-latest
    env:
      RENTAL_DEPLOY_HOST: ${{ secrets.DEPLOY_HOST || secrets.RENTAL_DEPLOY_HOST || secrets.SERVER_HOST || secrets.SSH_HOST }}
      RENTAL_DEPLOY_USER: ${{ secrets.DEPLOY_USER || secrets.RENTAL_DEPLOY_USER || secrets.SERVER_USER || secrets.SSH_USER }}
      RENTAL_DEPLOY_PORT: ${{ secrets.DEPLOY_PORT || secrets.RENTAL_DEPLOY_PORT || secrets.SERVER_PORT || secrets.SSH_PORT }}
      RENTAL_DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY || secrets.RENTAL_DEPLOY_SSH_KEY || secrets.SSH_PRIVATE_KEY || secrets.SERVER_SSH_KEY }}

    steps:
      - name: Validate deployment secrets
        shell: bash
        run: |
          set -euo pipefail
          missing=0
          if [ -z "${RENTAL_DEPLOY_HOST:-}" ]; then echo "Missing deploy host. Add one of: DEPLOY_HOST, RENTAL_DEPLOY_HOST, SERVER_HOST, SSH_HOST"; missing=1; fi
          if [ -z "${RENTAL_DEPLOY_USER:-}" ]; then echo "Missing deploy user. Add one of: DEPLOY_USER, RENTAL_DEPLOY_USER, SERVER_USER, SSH_USER"; missing=1; fi
          if [ -z "${RENTAL_DEPLOY_PORT:-}" ]; then echo "Missing deploy port. Add one of: DEPLOY_PORT, RENTAL_DEPLOY_PORT, SERVER_PORT, SSH_PORT"; missing=1; fi
          if [ -z "${RENTAL_DEPLOY_SSH_KEY:-}" ]; then echo "Missing SSH key. Add one of: DEPLOY_SSH_KEY, RENTAL_DEPLOY_SSH_KEY, SSH_PRIVATE_KEY, SERVER_SSH_KEY"; missing=1; fi
          exit "$missing"

      - name: Deploy over SSH
        shell: bash
        timeout-minutes: 15
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          printf '%s\n' "$RENTAL_DEPLOY_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -p "$RENTAL_DEPLOY_PORT" "$RENTAL_DEPLOY_HOST" >> ~/.ssh/known_hosts

          ssh -i ~/.ssh/deploy_key -p "$RENTAL_DEPLOY_PORT" -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes "$RENTAL_DEPLOY_USER@$RENTAL_DEPLOY_HOST" 'bash -s' <<'REMOTE'
          set -e

          SOURCE="/home/pmsa/apps/rental-source"
          MOBILE_PATH="/home/pmsa/apps/rental/my-rentals-mobile"
          REPO="git@github.com:Bafageeh/rental.git"

          mkdir -p /home/pmsa/apps

          if [ ! -d "$SOURCE/.git" ]; then
            rm -rf "$SOURCE"
            git clone "$REPO" "$SOURCE"
          else
            cd "$SOURCE"
            git remote set-url origin "$REPO"
            git fetch origin main
            git reset --hard origin/main
          fi

          mkdir -p "$MOBILE_PATH"
          rsync -a --delete \
            --exclude='.git' \
            --exclude='node_modules' \
            --exclude='.expo' \
            "$SOURCE/my-rentals-mobile/" "$MOBILE_PATH/"

          cd "$MOBILE_PATH"

          mkdir -p /home/pmsa/apps/.cache /home/pmsa/apps/.tmp
          rm -rf .expo .expo-shared node_modules/.cache .metro-cache
          rm -rf /home/pmsa/apps/.cache/expo /home/pmsa/apps/.cache/metro /home/pmsa/apps/.cache/react-native

          npm install --no-audit --no-fund

          # Target the SDK 55 development client instead of Expo Go.
          sed -i 's/--go --host/--dev-client --host/' scripts/start-expo-8081.sh || true
          # Expo Router typed routes expect this directory after the startup script clears .expo.
          sed -i '/rm -rf \.expo \.expo-shared \.metro-cache node_modules\/\.cache || true/a mkdir -p .expo/types' scripts/start-expo-8081.sh || true
          chmod +x scripts/start-expo-8081.sh || true
          bash scripts/start-expo-8081.sh || true

          sleep 8
          tail -n 120 /home/pmsa/apps/my-rentals-expo.log || true
          REMOTE
