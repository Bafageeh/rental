    subtitle: "اسم الوحدة والقيمة الإيجارية المقترحة.",
    icon: "🏠",
    fields: ["unit_number", "rent_amount"],
  },
  {
    title: "المواصفات الداخلية",
    subtitle: "الغرف والحمامات والمرافق الأساسية.",
    icon: "🧩",
    fields: ["rooms_count", "bathrooms_count", "has_living_room", "is_rooftop", "orientation"],
  },
  {
    title: "المطبخ",
    subtitle: "خيارات المطبخ بدون حقول رقمية إضافية.",
    icon: "🍳",
    fields: ["has_kitchen", "kitchen_type", "is_kitchen_installed"],
  },
  {
    title: "ملاحظات",
    subtitle: "أي تفاصيل إضافية عن الوحدة.",
    icon: "📝",
    fields: ["notes"],
  },
];
''', 'unit editor constants')

          replace_once('''      const editableFields = resource === "owners"
        ? item.editable_fields.filter((field: string) => field !== "type")
        : item.editable_fields;
