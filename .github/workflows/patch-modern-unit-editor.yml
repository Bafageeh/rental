name: Patch modern unit editor

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/patch-modern-unit-editor.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Redesign unit edit modal
        run: |
          python3 <<'PY'
          from pathlib import Path

          p = Path('my-rentals-mobile/src/components/InlineEditDeleteActions.tsx')
          s = p.read_text(encoding='utf-8')

          def replace_once(old, new, label):
              global s
              if old not in s:
                  raise SystemExit(f'Missing target: {label}')
              s = s.replace(old, new, 1)

          replace_once('''function isPropertyResource(resource: string | null | undefined) {
  return resource === "properties" || resource === "property";
}
''', '''function isPropertyResource(resource: string | null | undefined) {
  return resource === "properties" || resource === "property";
}

function isUnitResource(resource: string | null | undefined) {
  return resource === "units" || resource === "unit";
}
''', 'isUnitResource helper')

          replace_once('''function isCompactPropertyOptionField(resource: string | null | undefined, field: string) {
  return isPropertyResource(resource) && field === "usage_type";
}
''', '''function isCompactPropertyOptionField(resource: string | null | undefined, field: string) {
  return isPropertyResource(resource) && field === "usage_type";
}

