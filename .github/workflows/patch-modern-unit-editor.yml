          replace_once('''  fieldBox: {
    backgroundColor: "#fff",
    borderRadius: 16,
    padding: 12,
    marginBottom: 8,
  },
''', '''  fieldBox: {
    backgroundColor: "#F8FAFC",
    borderRadius: 18,
    padding: 12,
    marginBottom: 8,
    borderWidth: 1,
    borderColor: "#EEF2F7",
  },
''', 'modern field box')

          p.write_text(s, encoding='utf-8')
          PY

      - name: Validate patch
        run: |
          grep -n "renderUnitEditor" my-rentals-mobile/src/components/InlineEditDeleteActions.tsx
          grep -n "!isBoolean && optionList.length === 0" my-rentals-mobile/src/components/InlineEditDeleteActions.tsx

      - name: Commit patch and remove workflow
        run: |
          rm -f .github/workflows/patch-modern-unit-editor.yml
          if git diff --quiet; then
            echo "No changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add my-rentals-mobile/src/components/InlineEditDeleteActions.tsx .github/workflows/patch-modern-unit-editor.yml
          git commit -m "Redesign unit edit modal"
          git push
