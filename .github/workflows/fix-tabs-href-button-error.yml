name: Fix tabs href button error

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/fix-tabs-href-button-error.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Remove href when tabBarButton is used
        run: |
          python3 <<'PY'
          from pathlib import Path
          p = Path('my-rentals-mobile/src/app/_layout.tsx')
          s = p.read_text(encoding='utf-8')
          s = s.replace('href: null, tabBarButton: () => null, ', 'tabBarButton: () => null, ')
          s = s.replace('href: null, tabBarButton: () => null, ', 'tabBarButton: () => null, ')
          p.write_text(s, encoding='utf-8')
          PY
      - name: Validate no invalid combination remains
        run: |
          python3 <<'PY'
          from pathlib import Path
          s = Path('my-rentals-mobile/src/app/_layout.tsx').read_text(encoding='utf-8')
          bad = [line for line in s.splitlines() if 'href: null' in line and 'tabBarButton' in line]
          if bad:
              print('\n'.join(bad[:20]))
              raise SystemExit('Invalid href + tabBarButton combination still exists')
          PY
      - name: Commit patch and remove workflow
        run: |
          rm -f .github/workflows/fix-tabs-href-button-error.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add my-rentals-mobile/src/app/_layout.tsx .github/workflows/fix-tabs-href-button-error.yml
          git commit -m "Fix hidden tab options error" || exit 0
          git push
