name: Fix hidden tabs hard

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/fix-hidden-tabs-hard.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Force-hide non-main tabs
        run: |
          python3 <<'PY'
          from pathlib import Path
          p = Path('my-rentals-mobile/src/app/_layout.tsx')
          s = p.read_text(encoding='utf-8')
          hide = 'href: null, tabBarButton: () => null, tabBarItemStyle: { display: "none" },'
          s = s.replace('href: null,', hide)
          # Make replacement idempotent if workflow is triggered twice.
          s = s.replace('href: null, tabBarButton: () => null, tabBarItemStyle: { display: "none" }, tabBarButton: () => null, tabBarItemStyle: { display: "none" },', hide)
          # Ensure WhatsApp inquiry center is declared as hidden so it never becomes a tab.
          anchor = '      <Tabs.Screen name="communication-center" options={{ '
          if 'name="inquiry-center"' not in s and anchor in s:
              line = '      <Tabs.Screen name="inquiry-center" options={{ href: null, tabBarButton: () => null, tabBarItemStyle: { display: "none" }, title: "مركز الاستفسارات" }} />\n'
              idx = s.find(anchor)
              line_start = s.rfind('\n', 0, idx) + 1
              s = s[:line_start] + line + s[line_start:]
          # Keep only these as visible tab entries: index, properties, owners, more.
          p.write_text(s, encoding='utf-8')
          PY
      - name: Validate no obvious visible extra tabs
        run: |
          grep -n "name=\"payments\"" my-rentals-mobile/src/app/_layout.tsx
          grep -n "name=\"inquiry-center\"" my-rentals-mobile/src/app/_layout.tsx
      - name: Commit patch and remove workflow
        run: |
          rm -f .github/workflows/fix-hidden-tabs-hard.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add my-rentals-mobile/src/app/_layout.tsx .github/workflows/fix-hidden-tabs-hard.yml
          git commit -m "Force hide non-main tabs" || exit 0
          git push
