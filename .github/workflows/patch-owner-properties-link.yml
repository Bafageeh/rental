name: Patch owner properties link

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/patch-owner-properties-link.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add separate owner properties link
        run: |
          python3 <<'PY'
          from pathlib import Path
          p = Path('my-rentals-mobile/src/components/OwnerDashboardScreenWithActions.tsx')
          s = p.read_text(encoding='utf-8')

          if 'function openOwnerPropertiesScreen()' not in s:
              s = s.replace(
'''  function openAddUnit() {
    router.push(`/units?owner_id=${encodeURIComponent(ownerId)}&owner_name=${ownerNameForUrl}&create=1` as never);
  }
''',
'''  function openAddUnit() {
    router.push(`/units?owner_id=${encodeURIComponent(ownerId)}&owner_name=${ownerNameForUrl}&create=1` as never);
  }

  function openOwnerPropertiesScreen() {
    router.push(`/owner-properties?owner_id=${encodeURIComponent(ownerId)}&owner_name=${ownerNameForUrl}` as never);
  }
''', 1)

          if 'فتح العقارات في شاشة مستقلة' not in s:
              s = s.replace(
'''      <View style={styles.addActionsRow}>
        <TouchableOpacity style={[styles.addActionButton, styles.addPropertyButton]} onPress={openAddProperty} activeOpacity={0.88}>
          <Text style={styles.addActionIcon}>＋</Text>
          <Text style={styles.addActionText}>إضافة عقار</Text>
        </TouchableOpacity>
        <TouchableOpacity style={[styles.addActionButton, styles.addUnitButton]} onPress={openAddUnit} activeOpacity={0.88}>
          <Text style={styles.addActionIcon}>＋</Text>
          <Text style={styles.addActionText}>إضافة وحدة</Text>
        </TouchableOpacity>
      </View>
''',
'''      <View>
        <TouchableOpacity style={styles.openSeparateAssetsButton} onPress={openOwnerPropertiesScreen} activeOpacity={0.9}>
          <Text style={styles.openSeparateAssetsIcon}>↗</Text>
          <View style={styles.openSeparateAssetsTextBox}>
            <Text style={styles.openSeparateAssetsTitle}>فتح العقارات في شاشة مستقلة</Text>
            <Text style={styles.openSeparateAssetsSub}>العقار والوحدة والتعديل كل واحد في صفحة منفصلة</Text>
          </View>
        </TouchableOpacity>
        <View style={styles.addActionsRow}>
          <TouchableOpacity style={[styles.addActionButton, styles.addPropertyButton]} onPress={openAddProperty} activeOpacity={0.88}>
            <Text style={styles.addActionIcon}>＋</Text>
            <Text style={styles.addActionText}>إضافة عقار</Text>
          </TouchableOpacity>
          <TouchableOpacity style={[styles.addActionButton, styles.addUnitButton]} onPress={openAddUnit} activeOpacity={0.88}>
            <Text style={styles.addActionIcon}>＋</Text>
            <Text style={styles.addActionText}>إضافة وحدة</Text>
          </TouchableOpacity>
        </View>
      </View>
''', 1)

          if 'openSeparateAssetsButton:' not in s:
              s = s.replace(
'''  addActionsRow: { flexDirection: "row-reverse", gap: 10, marginBottom: 12 },
''',
'''  openSeparateAssetsButton: { backgroundColor: "#0f172a", borderRadius: 20, padding: 14, marginBottom: 10, flexDirection: "row-reverse", alignItems: "center", gap: 10, shadowColor: "#000", shadowOpacity: 0.08, shadowRadius: 12, elevation: 2 },
  openSeparateAssetsIcon: { width: 38, height: 38, borderRadius: 19, overflow: "hidden", backgroundColor: "#ffffff", color: "#0f172a", textAlign: "center", textAlignVertical: "center", fontSize: 22, fontWeight: "900" },
  openSeparateAssetsTextBox: { flex: 1, alignItems: "flex-end" },
  openSeparateAssetsTitle: { color: "#ffffff", fontSize: 16, fontWeight: "900", textAlign: "right" },
  openSeparateAssetsSub: { color: "#cbd5e1", fontSize: 12, fontWeight: "800", marginTop: 3, textAlign: "right" },
  addActionsRow: { flexDirection: "row-reverse", gap: 10, marginBottom: 12 },
''', 1)

          p.write_text(s, encoding='utf-8')
          PY
      - name: Commit patch and remove workflow
        run: |
          rm -f .github/workflows/patch-owner-properties-link.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add my-rentals-mobile/src/components/OwnerDashboardScreenWithActions.tsx .github/workflows/patch-owner-properties-link.yml
          git commit -m "Add separate owner properties navigation" || exit 0
          git push
