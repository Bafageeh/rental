name: Build Rental Internal APK

on:
  workflow_dispatch:

jobs:
  build-apk:
    name: Build Android APK
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: my-rentals-mobile

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install dependencies
        env:
          NPM_CONFIG_LEGACY_PEER_DEPS: true
        run: npm install --legacy-peer-deps --no-audit --no-fund

      - name: Align Expo notifications version
        env:
          CI: 1
          EXPO_NO_TELEMETRY: 1
          NPM_CONFIG_LEGACY_PEER_DEPS: true
        run: npx expo install expo-notifications

      - name: Prebuild Android project
        env:
          EXPO_NO_TELEMETRY: 1
        run: npx expo prebuild --platform android --clean --no-install

      - name: Build release APK
        run: |
          cd android
          chmod +x ./gradlew
          ./gradlew assembleRelease --no-daemon

      - name: Collect APK
        run: |
          mkdir -p ../apk-output
          cp android/app/build/outputs/apk/release/*.apk ../apk-output/rental-release.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: rental-apk
          path: apk-output/rental-release.apk
          if-no-files-found: error
          retention-days: 14
