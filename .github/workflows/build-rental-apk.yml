name: Build Rental APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'my-rentals-mobile/**'
      - '.github/workflows/build-rental-apk.yml'

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: my-rentals-mobile/package-lock.json

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install dependencies
        working-directory: my-rentals-mobile
        run: npm ci

      - name: Prebuild Android project
        working-directory: my-rentals-mobile
        env:
          EXPO_NO_TELEMETRY: '1'
        run: npx expo prebuild --platform android --clean --no-install

      - name: Build debug APK
        working-directory: my-rentals-mobile/android
        run: |
          chmod +x ./gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Rename APK
        run: |
          mkdir -p artifacts
          cp my-rentals-mobile/android/app/build/outputs/apk/debug/app-debug.apk artifacts/my-rentals.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: my-rentals-apk
          path: artifacts/my-rentals.apk
          if-no-files-found: error
          retention-days: 14
