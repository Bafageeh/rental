name: Build Rental APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'my-rentals-mobile/**'
      - '.github/workflows/build-rental-apk.yml'

permissions:
  contents: read

defaults:
  run:
    working-directory: my-rentals-mobile

jobs:
  build-android-apk:
    name: Build Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install mobile dependencies
        env:
          NPM_CONFIG_LEGACY_PEER_DEPS: true
        run: npm install --legacy-peer-deps --no-audit --no-fund

      - name: Prebuild Android project
        env:
          EXPO_NO_TELEMETRY: 1
          NPM_CONFIG_LEGACY_PEER_DEPS: true
        run: npx expo prebuild --platform android --clean --no-install

      - name: Build local APK
        working-directory: my-rentals-mobile/android
        env:
          EXPO_NO_TELEMETRY: 1
        run: |
          chmod +x ./gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Prepare APK artifact
        run: |
          mkdir -p artifacts
          cp android/app/build/outputs/apk/debug/app-debug.apk artifacts/my-rentals.apk
          ls -lh artifacts/my-rentals.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: my-rentals-apk
          path: my-rentals-mobile/artifacts/my-rentals.apk
          if-no-files-found: error
          retention-days: 14
